<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>web_preview.html</title>
<style>
  :root {
    --bg-dark: #000000;
    --card-bg: rgba(28, 28, 30, 0.92);
    --card-border: rgba(255, 255, 255, 0.18);
    --text-primary: #f2f2f7;
    --text-secondary: #a1a1a6;
    --accent: #34C759;
    --radius-card: 14px;
    --radius-inner: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  /* Floating snapshot card anchored top-right */
  #web_preview_snapshot {
    position: fixed;
    top: 36px;
    right: 16px;
    width: 260px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    padding: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
    user-select: none;
  }

  /* Pointer arrow matching menubar icon position */
  #web_preview_snapshot::before {
    content: '';
    position: absolute;
    top: -6px;
    right: 22px;
    width: 10px;
    height: 10px;
    background: var(--card-bg);
    border-top: 1px solid var(--card-border);
    border-left: 1px solid var(--card-border);
    transform: rotate(45deg);
  }

  .preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--accent);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent);
    border-radius: 50%;
  }

  /* Snapshot Frame Container */
  .snapshot-frame {
    width: 100%;
    height: 140px;
    background: #1c1c1e;
    border-radius: var(--radius-inner);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  /* Target top-right of page with pointer events enabled */
  .preview-iframe {
    position: absolute;
    top: 0;
    right: -50px;
    width: 1400px;
    height: 600px;
    transform: scale(.8);
    transform-origin: top right;
    border: none;
    pointer-events: auto; /* Enables click and drag interactions */
  }

  /* Invisible capture layer for Option+Drag gestures */
  .drag-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: none;
  }

  .scrubhud-caption {
    font-size: 12px;
    line-height: 1.4;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.05);
    border-left: 3px solid var(--accent);
    padding: 8px 10px;
    border-radius: 4px;
  }

  .kbd {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
  }

  /* ScrubHUD Overlay Module */
  #scrubhud_overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 380px;
    background: rgba(18, 18, 20, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(30px);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  #scrubhud_overlay.active {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
  }

  .hud-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
  }

  .hud-scrubber {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hud-scrubber input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .hud-readout {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    font-mono: monospace;
  }
</style>
</head>
<body>

<div id="web_preview_snapshot">
  <div class="preview-header">
    <span>web_preview.html</span>
    <span class="live-indicator"><span class="live-dot"></span>Snapshot</span>
  </div>

  <div class="snapshot-frame" id="snapshotCard">
    <div class="drag-overlay" id="dragOverlay"></div>
    <iframe src="web_preview.html" class="preview-iframe" id="previewIframe" title="web_preview.html stream"></iframe>
  </div>

  <div class="scrubhud-caption">
    To open the <strong>ScrubHUD</strong> inside <code>web_preview.html</code>, press <span class="kbd">⌥ Option</span> + drag over the preview or press <span class="kbd">⌘</span> + <span class="kbd">K</span>.
  </div>
</div>

<!-- Active ScrubHUD Dialog -->
<div id="scrubhud_overlay">
  <div class="hud-header">
    <span>ScrubHUD Simulator</span>
    <button class="hud-close" id="closeHud">&times;</button>
  </div>
  <div class="hud-scrubber">
    <input type="range" id="frameScrubber" min="0" max="100" value="0">
    <div class="hud-readout">
      <span>Frame State</span>
      <span id="frameVal">0 / 100</span>
    </div>
  </div>
</div>

<script>
  const snapshotCard = document.getElementById('snapshotCard');
  const dragOverlay = document.getElementById('dragOverlay');
  const scrubHud = document.getElementById('scrubhud_overlay');
  const closeHud = document.getElementById('closeHud');
  const frameScrubber = document.getElementById('frameScrubber');
  const frameVal = document.getElementById('frameVal');

  let isOptionPressed = false;
  let isDragging = false;

  // Toggle native app or protocol link on direct click
  snapshotCard.addEventListener('click', (e) => {
    if (!isOptionPressed) {
      // Triggers custom desktop protocol if configured on macOS
      window.location.href = "avrlink://open";
    }
  });

  // Keyboard shortcut listener (⌘ + K or Ctrl + K)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Alt') {
      isOptionPressed = true;
      dragOverlay.style.display = 'block'; // Capture drag movements
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      toggleHUD();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'Alt') {
      isOptionPressed = false;
      dragOverlay.style.display = 'none';
      isDragging = false;
    }
  });

  // Option + Drag Gesture Handling
  dragOverlay.addEventListener('mousedown', (e) => {
    if (isOptionPressed) {
      isDragging = true;
      scrubHud.classList.add('active');
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isDragging) {
      const rect = snapshotCard.getBoundingClientRect();
      const relativeX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const percentage = Math.round((relativeX / rect.width) * 100);
      
      frameScrubber.value = percentage;
      frameVal.textContent = `${percentage} / 100`;
    }
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // HUD Control functions
  function toggleHUD() {
    scrubHud.classList.toggle('active');
  }

  closeHud.addEventListener('click', () => {
    scrubHud.classList.remove('active');
  });

  frameScrubber.addEventListener('input', (e) => {
    frameVal.textContent = `${e.target.value} / 100`;
  });
</script>

</body>
</html>
